<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ST-style — shape</title>

<link rel="stylesheet" href="../dist/main.min.css">

<!--
  Фигуру .shape-layer обычно строит st-script Shape; здесь svg и clip-path записаны вручную,
  чтобы показать CSS без скриптов. Цвета задаёт родитель, они наследуются в [shape].
-->
<style>
  body        { background: #0b0c10; color: #f2f2f2; font-family: system-ui, "Segoe UI", sans-serif; line-height: 1.35; }
  a           { color: inherit; }
  .tech, .promo { padding-inline: 2.4rem; isolation: isolate; }

  /* Фигура на дочернем __bg: картинка выступает за неё и не обрезается клипом. */
  .tech       { min-height: 24rem; --shape-bg: #17181d; --shape-line: rgb(255 255 255 / .1); }
  .tech:hover { --shape-bg: rgb(40 41 31 / .81); --shape-line: rgb(231 235 112 / .3); }
  .tech__bg   { position: absolute; inset: 0; z-index: -1; clip-path: polygon(2rem 0, 100% 0, 100% calc(100% - 2rem), calc(100% - 2rem) 100%, 0 100%, 0 2rem); }
  .tech__img  { position: absolute; right: -2rem; top: -3rem; width: 12rem; height: 12rem; border-radius: 50%;
                background: radial-gradient(circle at 30% 30%, #e7eb70, #a3701a); }

  /* Без своего ховера: цвета заданы один раз. */
  .promo      { --shape-bg: #17181d; --shape-line: rgb(255 255 255 / .1); min-height: 14rem; }
</style>
</head>
<body>

<section pt="12" pb="12">
  <div container>
    <h1 tx="h2" fw="bold" mb="8">shape</h1>

    <div grid="gap-4">
      <!-- Фигура на дочернем __bg: ховер родителя перекрашивает её через --shape-*. -->
      <article class="tech" id="tech" col="12 md-6 lp-4" ps="relative" p="6">
        <div class="tech__bg" shape>
          <svg class="shape-layer" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 100 100">
            <path d="M0 0H100V100H0Z" vector-effect="non-scaling-stroke"/>
          </svg>
        </div>
        <span class="tech__img" aria-hidden="true"></span>
        <h3 tx="h4" fw="semibold" mb="2"><a href="#tech">Фигура на __bg</a></h3>
        <p>Картинка выступает за фигуру, фигура перекрашивается на ховер родителя.</p>
      </article>

      <!-- Цвета без ховера: --shape-* на родителе. -->
      <div class="promo" col="12 md-6 lp-8" ps="relative" p="6">
        <div class="tech__bg" shape>
          <svg class="shape-layer" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 100 100">
            <path d="M0 0H100V100H0Z" vector-effect="non-scaling-stroke"/>
          </svg>
        </div>
        <p><code>.promo { --shape-bg }</code> доходит до дочернего <code>[shape]</code>.</p>
      </div>
    </div>
  </div>
</section>

</body>
</html>
